<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador | MediGo</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos-login.css">
    <style>
        .icono-titulo { background-color: #1A202C; }
        .titulo-seccion h4 { color: #1A202C; }
        .caja-demo { background-color: #f3f4f6; color: #374151; }
        .boton-login { background-color: #1A202C; }
    </style>
</head>
<body>
    <div class="contenedor-login">
        <span class="cerrar">×</span>

        <div class="encabezado">
            <div class="icono-titulo">
                <i class="fa fa-cog"></i>
            </div>
            <div class="titulo-seccion">
                <h4>Panel Administrador</h4>
                <h2>Acceso administrativo</h2>
            </div>
        </div>

        <div class="alerta-admin">
            <i class="fa fa-exclamation-triangle"></i>
            Acceso restringido — solo personal autorizado
        </div>

        <form>
            <div class="grupo-input">
                <label>Usuario *</label>
                <div class="input-con-icono">
                    <i class="fa fa-user-o"></i>
                    <input type="text" placeholder="admin">
                </div>
            </div>

            <div class="grupo-input">
                <label>Contraseña *</label>
                <div class="input-con-icono">
                    <i class="fa fa-lock"></i>
                    <input type="password" placeholder="">
                </div>
            </div>

            <button type="submit" class="boton-login">
                <i class="fa fa-cog"></i> Ingresar al panel
            </button>
           <p style="text-align: center; margin-top: 15px; font-size: 14px;">
                ¿No tienes cuenta? <a href="registro.html" style="color: #1a2333; font-weight: bold; text-decoration: none;">Solicitar registro</a>
            </p> 
        </form>

        <div class="volver">
            <a href="../index.html">← Volver a la página principal</a>
        </div>
    </div>
</body>
</html>
