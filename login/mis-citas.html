<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Citas | MediGo</title>

    <link rel="stylesheet" href="fronted.css">
    <link rel="stylesheet" href="estilos.mis-citas.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <i class="fa-solid fa-heart-pulse"></i>
                <span>MediGo</span>
            </div>

            <div class="user-box">

                <div class="avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div>
                    <p id="nombreUsuarioSidebar">Cargando...</p>
                    <small id="dniUsuario">DNI: Cargando...</small>
                </div>

            </div>

            <nav class="menu">

                <a href="fronted.html">
                    <i class="fa-solid fa-grid"></i>
                    Inicio
                </a>

                <a href="agendar.html">
                    <i class="fa-solid fa-calendar-plus"></i>
                    Agendar Cita
                </a>

                <!-- ESTA ES LA OPCIÓN ACTIVA -->
                <a href="mis-citas.html" class="active">
                    <i class="fa-solid fa-calendar"></i>
                    Mis Citas
                </a>

                <a href="Historial.html">
                    <i class="fa-solid fa-file-medical"></i>
                    Historial Médico
                </a>

                <a>
                    <i class="fa-solid fa-dollar-sign"></i>
                    Pagos
                </a>

                <a>
                    <i class="fa-solid fa-bell"></i>
                    Notificaciones
                </a>

                <a>
                    <i class="fa-solid fa-user"></i>
                    Mi Perfil
                </a>

            </nav>

            <button class="logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                Cerrar sesión
            </button>

        </aside>

        <!-- CONTENIDO -->
        <main class="main">

            <header class="topbar">

                <h1>Mis Citas</h1>

                <div class="icons">
                    <i class="fa-solid fa-bell"></i>
                    <i class="fa-solid fa-user-circle"></i>
                </div>

            </header>

            <!-- Filtros -->
            <div class="filtros-citas">

                <button class="filtro-btn active" data-filtro="todas" onclick="filtrarCitas('todas', this)">
                    Todas
                </button>

                <button class="filtro-btn" data-filtro="pendiente" onclick="filtrarCitas('pendiente', this)">
                    Pendientes
                </button>

                <button class="filtro-btn" data-filtro="confirmada" onclick="filtrarCitas('confirmada', this)">
                    Confirmadas
                </button>

                <button class="filtro-btn" data-filtro="finalizada" onclick="filtrarCitas('finalizada', this)">
                    Finalizadas
                </button>

            </div>

            <!-- Lista de citas -->
            <div id="lista-citas" class="lista-citas">
                <p class="cargando-texto">Cargando tus citas...</p>
            </div>

            <!-- Estado vacío -->
            <section class="empty" id="empty-citas" style="display:none;">

                <i class="fa-regular fa-calendar-plus"></i>

                <h3>No tienes citas registradas</h3>

                <p>Cuando agendes una consulta, aparecerá aquí.</p>

                <button onclick="window.location.href='agendar.html'">
                    Agendar mi primera cita
                </button>

            </section>

        </main>

    </div>

    <script type="module" src="mis-citas.js"></script>

</body>

</html>
